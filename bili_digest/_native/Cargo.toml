[package]
name = "kb_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "kb_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
md-5 = "0.10"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
