[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-digest"
version = "4.0.0"
description = "把 B站收藏变成本地可检索的知识库：字幕/弹幕/评论 → LLM 提炼 → 混合检索 + MCP 服务"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bili-digest contributors" }]
keywords = ["rag", "retrieval", "bilibili", "knowledge-base", "mcp", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "fastembed>=0.3",
    # 曾用 <2.10 上界锁在 2.9.2，理由是「rag_core 调了 Index._resolve_current 私有 API」——
    # 该判断不成立：_resolve_current 是 VectorIndex 自己的方法，usearch 侧只用公开 API
    # （Index / MetricKind / ScalarKind + add/search/save/load/view/remove/get/expansion_search）。
    # 2.26.6 实测：旧 2.9.2 索引可直接 view（235419 条），检索 top5 逐字节一致，
    # 项目整体（kb search 混合检索）正常，写入 add(keys,vecs) 签名不变，
    # search@256 从 17.6ms 降到 10.2ms（快 42%）。唯一消失的 compact() 是无调用点的死方法。
    "usearch>=2.9",
    # jieba 0.42.1 是最后一版（2020-01-20 发布，作者不再维护）——
    # 所以「可更新」在这个包上不成立。而 [tokenizer] 组另有 cppjieba-py-dat，
    # 那意味着项目里有两条切词路径。要不要合并是另一个问题，不是升级问题。
    "jieba>=0.42",
    "numpy>=1.24",
]

[project.optional-dependencies]
# 扫码登录用；不用扫码可不装
login = ["qrcode>=7.4"]
# quiz --rate 的间隔重复排程
review = ["fsrs>=5.0"]
# 切词引擎，装了省约 1.1 秒启动
tokenizer = ["cppjieba-py-dat"]
# MCP server 需要官方 SDK
mcp = ["mcp>=1.0"]
# 按需 ASR（给无字幕条目补字幕）；不装不影响任何既有功能
asr = ["faster-whisper>=1.0", "yt-dlp>=2024.1"]
# 按需画面描述（给零字幕空壳视频补 visual_desc，kb visual）。
# 纯 CPU 可跑但重：torch 2.4+ + transformers 5.2 + 6.5GB WeMM-Video-2B 权重。
# 权重不随包分发，首次用按 kb visual --dry 的提示下载；不装不影响任何既有功能。
visual = [
    "torch>=2.4",
    "transformers>=5.2",
    "tokenizers>=0.22,<0.23",
    "huggingface-hub>=1.3,<2",
    "soundfile>=0.12",
    "scipy>=1.10",
    "pillow>=10,<15",
    "torchvision>=0.19",
    "yt-dlp>=2024.1",
]

[project.scripts]
kb = "bili_digest.cli.main:main"
kb-mcp = "bili_digest.mcp.server:main"

[tool.setuptools.packages.find]
include = ["bili_digest*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
# weights.toml 是检索权重的唯一来源，装包时必须一起带上 ——
# 少了它，rag_core 在 import 阶段就会抛 ConfigError（不静默兜底）。
bili_digest = ["py.typed", "retrieve/weights.toml"]
